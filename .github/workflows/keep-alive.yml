name: Keep Alive

on:
  schedule:
    # Ping every 14 minutes to prevent Render free tier from sleeping
    - cron: "*/14 * * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://bubb-api.onrender.com/api/health)
          echo "Health check returned: $response"
          if [ "$response" != "200" ]; then
            echo "::warning::Health check returned $response"
          fi
